<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offre Widget Smoke</title>
    <link rel="stylesheet" href="../dist/assets/offre-widget-vite-eSPpTUMv.css" />
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4efe6;
        color: #1f2937;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(245, 158, 11, 0.22), transparent 38%),
          linear-gradient(180deg, #fffaf2 0%, #f5efe5 100%);
      }

      .smoke-shell {
        width: min(1200px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0 120px;
      }

      .smoke-panel {
        position: sticky;
        top: 0;
        z-index: 5;
        display: grid;
        gap: 12px;
        margin-bottom: 24px;
        padding: 16px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(10px);
        box-shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
      }

      .smoke-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .smoke-button {
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        background: #ea580c;
        color: white;
        font: inherit;
        cursor: pointer;
      }

      .smoke-button--secondary {
        background: #475569;
      }

      .smoke-status {
        font-size: 14px;
        line-height: 1.5;
        color: #334155;
        white-space: pre-wrap;
      }

      .smoke-spacer {
        min-height: 85vh;
        display: grid;
        place-items: center;
        margin: 24px 0;
        border: 1px dashed rgba(71, 85, 105, 0.28);
        border-radius: 28px;
        color: #64748b;
        background: rgba(255, 255, 255, 0.55);
      }

      #widget-host {
        min-height: 320px;
      }
    </style>
    <script>
      const HOTEL_FIXTURES = [
        {
          id: 101,
          name: "Coral Sands Resort",
          locationSummary: "Белек, Анталья, Турция",
          categoryKey: "5",
          countryKey: "turkey",
          regionKey: "antalya",
          areaKey: "belek-area",
          placeKey: "belek",
          recommended: true
        },
        {
          id: 202,
          name: "Azure Dunes Hotel",
          locationSummary: "Сиде, Анталья, Турция",
          categoryKey: "5",
          countryKey: "turkey",
          regionKey: "antalya",
          areaKey: "side-area",
          placeKey: "side",
          exclusive: true
        },
        {
          id: 303,
          name: "Lagoon Vista Suites",
          locationSummary: "Кемер, Анталья, Турция",
          categoryKey: "4",
          countryKey: "turkey",
          regionKey: "antalya",
          areaKey: "kemer-area",
          placeKey: "kemer"
        },
        {
          id: 404,
          name: "Aegean Breeze Club",
          locationSummary: "Бодрум, Эгейское побережье, Турция",
          categoryKey: "5",
          countryKey: "turkey",
          regionKey: "aegean",
          areaKey: "bodrum-area",
          placeKey: "bodrum",
          coralFamilyClub: true
        },
        {
          id: 505,
          name: "Marina Garden Select",
          locationSummary: "Мармарис, Эгейское побережье, Турция",
          categoryKey: "4",
          countryKey: "turkey",
          regionKey: "aegean",
          areaKey: "marmaris-area",
          placeKey: "marmaris"
        },
        {
          id: 606,
          name: "Golden Coast Escape",
          locationSummary: "Фетхие, Эгейское побережье, Турция",
          categoryKey: "5",
          countryKey: "turkey",
          regionKey: "aegean",
          areaKey: "fethiye-area",
          placeKey: "fethiye",
          eliteHotel: true
        }
      ];

      function createOffer(hotelId, index) {
        const amount = 128000 + index * 9000;

        return {
          checkInDate: "2026-06-20",
          stayNights: 7 + (index % 2),
          price: {
            amount,
            oldAmount: amount + 16000,
            discountPercent: 12
          },
          flight: {
            flightDate: "2026-06-20"
          },
          link: {
            redirectionUrl: `/offer/mock-${hotelId}`,
            queryParam: `offer=${hotelId}`
          },
          rooms: [{
            mealKey: "ai",
            passengers: [
              { age: 34, passengerType: 0 },
              { age: 31, passengerType: 0 }
            ]
          }]
        };
      }

      function buildProducts() {
        return HOTEL_FIXTURES.map((hotel, index) => ({
          hotel: {
            id: hotel.id,
            name: hotel.name,
            locationSummary: hotel.locationSummary,
            categoryKey: hotel.categoryKey,
            countryKey: hotel.countryKey,
            regionKey: hotel.regionKey,
            areaKey: hotel.areaKey,
            placeKey: hotel.placeKey,
            recommended: Boolean(hotel.recommended),
            exclusive: Boolean(hotel.exclusive),
            eliteHotel: Boolean(hotel.eliteHotel),
            coralFamilyClub: Boolean(hotel.coralFamilyClub),
            location: {
              id: hotel.placeKey,
              type: 7,
              name: hotel.locationSummary
            }
          },
          offers: [createOffer(hotel.id, index)]
        }));
      }

      function jsonResponse(result) {
        return Promise.resolve(new Response(JSON.stringify({ result }), {
          status: 200,
          headers: {
            "Content-Type": "application/json"
          }
        }));
      }

      const originalFetch = window.fetch.bind(window);

      window.fetch = async (input, init) => {
        const url = typeof input === "string" ? input : input.url;

        if (!url.includes("/endpoints/")) {
          return originalFetch(input, init);
        }

        if (url.endsWith("/HotelContent/ListHotelsInfo")) {
          return jsonResponse({
            hotels: HOTEL_FIXTURES.map((hotel) => ({
              id: hotel.id,
              name: hotel.name,
              countryKey: hotel.countryKey,
              regionKey: hotel.regionKey,
              areaKey: hotel.areaKey,
              placeKey: hotel.placeKey,
              location: {
                id: hotel.placeKey,
                type: 7,
                name: hotel.locationSummary
              }
            })),
            countries: {
              turkey: { name: "Турция" }
            },
            regions: {
              antalya: { name: "Анталья" },
              aegean: { name: "Эгейское побережье" }
            },
            areas: {
              "belek-area": { name: "Белек" },
              "side-area": { name: "Сиде" },
              "kemer-area": { name: "Кемер" },
              "bodrum-area": { name: "Бодрум" },
              "marmaris-area": { name: "Мармарис" },
              "fethiye-area": { name: "Фетхие" }
            },
            places: {
              belek: { name: "Белек" },
              side: { name: "Сиде" },
              kemer: { name: "Кемер" },
              bodrum: { name: "Бодрум" },
              marmaris: { name: "Мармарис" },
              fethiye: { name: "Фетхие" }
            }
          });
        }

        if (url.endsWith("/PackageTourHotelProduct/ListDepartureLocations")) {
          return jsonResponse({
            locations: [
              { id: "mow", type: 3, name: "Москва", isCurrent: true },
              { id: "led", type: 3, name: "Санкт-Петербург" }
            ]
          });
        }

        if (url.endsWith("/PackageTourHotelProduct/PriceSearchList")) {
          return jsonResponse({
            products: buildProducts(),
            topProducts: [],
            reference: {
              hotelCategories: {
                4: { name: "4*", starCount: 4 },
                5: { name: "5*", starCount: 5 }
              },
              meals: {
                ai: { name: "AI" }
              }
            }
          });
        }

        if (url.endsWith("/OnlyHotelProduct/PriceSearchList")) {
          return jsonResponse({
            products: [{
              offers: [createOffer("hotel-only", 0)]
            }]
          });
        }

        return originalFetch(input, init);
      };
    </script>
  </head>
  <body>
    <div class="smoke-shell">
      <section class="smoke-panel">
        <strong>Offre widget smoke harness</strong>
        <div class="smoke-actions">
          <button class="smoke-button" id="bootstrap-button" type="button">Bootstrap</button>
          <button class="smoke-button smoke-button--secondary" id="double-bootstrap-button" type="button">Bootstrap x2</button>
          <button class="smoke-button smoke-button--secondary" id="unmount-button" type="button">Unmount</button>
          <button class="smoke-button smoke-button--secondary" id="scroll-button" type="button">Scroll to widget</button>
        </div>
        <div class="smoke-status" id="smoke-status">Preparing harness…</div>
      </section>

      <section class="smoke-spacer">Scroll area above the widget</section>

      <main id="widget-host">
        <script type="application/json" data-offre-vue-test>
          {
            "brand": "coral",
            "options": {
              "theme": "default",
              "groupBy": "regions",
              "chartersOnly": false,
              "nights": [7, 8],
              "timeframe": {
                "fluid": ["P14D", "P90D"],
                "monthly": true
              },
              "preferRegion": "Анталья",
              "sortBy": "price"
            },
            "hotels": [
              { "id": 101 },
              { "id": 202 },
              { "id": 303 },
              { "id": 404 },
              { "id": 505 },
              { "id": 606 }
            ]
          }
        </script>
      </main>

      <section class="smoke-spacer">Scroll area below the widget</section>
    </div>

    <script src="../node_modules/vue/dist/vue.global.js"></script>
    <script src="../dist/offre-widget.iife.js"></script>
    <script>
      const host = document.getElementById("widget-host");
      const status = document.getElementById("smoke-status");

      function getRootCount() {
        return host.querySelectorAll("[data-offre-widget-root='true']").length;
      }

      function getMountedScript() {
        return host.querySelector("script[data-offre-vue-test]");
      }

      function getNavigation() {
        return host.querySelector(".offre-widget__navigation");
      }

      function updateStatus(label) {
        const script = getMountedScript();
        const navigation = getNavigation();
        const mountedWidgets = window.OffreWidget?.bootstrap ? getRootCount() : 0;
        const navigationFixed = navigation?.getAttribute("data-fixed") ?? "n/a";
        const navigationClasses = navigation?.className ?? "n/a";

        status.textContent = [
          label,
          `widgetRoots: ${mountedWidgets}`,
          `scriptMountedAttr: ${script?.getAttribute("data-offre-widget-mounted") ?? "false"}`,
          `scriptInstanceId: ${script?.getAttribute("data-offre-widget-instance-id") ?? ""}`,
          `navigationFixed: ${navigationFixed}`,
          `navigationClasses: ${navigationClasses}`
        ].join("\n");
      }

      function bootstrapOnce() {
        const result = window.OffreWidget?.bootstrap?.(host) ?? [];
        updateStatus(`bootstrap() -> ${result.length}`);
        return result;
      }

      function unmountAll() {
        const unmounted = window.OffreWidget?.unmount?.(host) ?? 0;
        updateStatus(`unmount() -> ${unmounted}`);
        return unmounted;
      }

      window.__offreSmoke = {
        bootstrapOnce,
        unmountAll,
        updateStatus
      };

      document.getElementById("bootstrap-button").addEventListener("click", () => {
        bootstrapOnce();
      });

      document.getElementById("double-bootstrap-button").addEventListener("click", () => {
        bootstrapOnce();
        bootstrapOnce();
      });

      document.getElementById("unmount-button").addEventListener("click", () => {
        unmountAll();
      });

      document.getElementById("scroll-button").addEventListener("click", () => {
        host.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      window.addEventListener("load", () => {
        bootstrapOnce();
      });
    </script>
  </body>
</html>
